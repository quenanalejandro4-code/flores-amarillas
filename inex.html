<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas con Snoopy 🌻✨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #ffeaa7, #fab1a0);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .contenedor {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #d63031;
            font-size: 2.3rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        p {
            color: #2d3436;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            max-width: 400px;
            padding: 0 20px;
            margin-top: 5px;
        }

        /* --- REPRODUCTOR --- */
        .reproductor {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            z-index: 100;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .reproductor:hover { transform: scale(1.05); }

        .icono-disco {
            font-size: 1.8rem;
            animation: rotarDisco 3s linear infinite;
            animation-play-state: paused;
        }

        .reproductor.sonando .icono-disco { animation-play-state: running; }

        .texto-musica {
            font-size: 0.85rem;
            font-weight: bold;
            color: #2d3436;
        }

        /* --- CONTENEDOR INTERACTIVO DE SNOOPY --- */
        .snoopy-contenedor {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 10px auto;
            cursor: pointer;
            animation: viento 4s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        .snoopy-contenedor:hover, .flor-item:hover {
            transform: scale(1.08);
        }

        .snoopy-contenedor.agitar, .flor-item.agitar {
            animation: emocion 0.5s ease-in-out;
        }

        .snoopy-img, .flor-png {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- GALERÍA DE FLORES FIJAS --- */
        .galeria-flores {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            z-index: 15;
        }

        .flor-item {
            width: 80px;
            height: 80px;
            cursor: pointer;
            transform-origin: bottom center;
            animation: viento 3.5s ease-in-out infinite alternate;
        }
        
        .flor-item:nth-child(2) { animation-duration: 4.5s; }
        .flor-item:nth-child(3) { animation-duration: 4s; }

        /* --- ESTILOS PARA LOS ELEMENTOS QUE FLOTAN (CORAZONES, PALABRAS, FLORES) --- */
        .corazon {
            position: absolute;
            bottom: -50px; /* Inician desde abajo de la pantalla */
            z-index: 50;
            pointer-events: none;
            animation: flotarHaciaArriba 3.5s linear forwards;
        }

        @keyframes flotarHaciaArriba {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.2);
                opacity: 0;
            }
        }

        /* --- EFECTOS MÁGICOS Y BRILLOS --- */
        .brillo {
            position: absolute;
            color: #fff200;
            text-shadow: 0 0 10px #fff200, 0 0 20px #fff;
            pointer-events: none;
            z-index: 1;
            animation: flotarBrillo 4s linear infinite;
            opacity: 0;
        }

        @keyframes flotarBrillo {
            0% { transform: translateY(105vh) rotate(0deg) scale(0); opacity: 0; }
            20% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.3); opacity: 0; }
        }

        @keyframes viento {
            0% { transform: rotate(-4deg); }
            100% { transform: rotate(4deg); }
        }

        @keyframes emocion {
            0% { transform: scale(1); }
            20% { transform: scale(1.1) rotate(-8deg); }
            40% { transform: scale(1.1) rotate(8deg); }
            60% { transform: scale(1.1) rotate(-5deg); }
            80% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1); }
        }

        @keyframes rotarDisco {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <audio id="musica" loop>
        <source src="enamorado-tuyo.mp3" type="audio/mpeg">
    </audio>

    <div class="reproductor" id="control-reproductor" onclick="alternarMusica()">
        <span class="icono-disco">💿</span>
        <div class="texto-musica" id="texto-reproductor">Cuarteto de Nos 🎵</div>
    </div>

    <div class="contenedor">
        <h1>¡Y si te parece que yo... 💛</h1>
        <p>¡Toca la pantalla para ver su sorpresa!</p>
        
        <!-- Contenedor de Snoopy -->
        <div class="snoopy-contenedor" id="snoopy" onclick="animarSorpresa(this)">
            <img class="snoopy-img" src="snoopy.png" alt="Snoopy con flores">
        </div>

        <!-- Galería fija abajo -->
        <div class="galeria-flores">
            <div class="flor-item" onclick="animarSorpresa(this)">
                <img class="flor-png" src="flor1.png" alt="Flor Amarilla 1">
            </div>
            <div class="flor-item" onclick="animarSorpresa(this)">
                <img class="flor-png" src="flor2.png" alt="Flor Amarilla 2">
            </div>
            <div class="flor-item" onclick="animarSorpresa(this)">
                <img class="flor-png" src="flor3.png" alt="Flor Amarilla 3">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
